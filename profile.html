<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テスト太郎 — AI エンジニア</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #12090a;
      color: #f0e8e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* 背景のグリッド */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(251, 146, 60, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(251, 146, 60, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* グロー効果 */
    body::after {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: rgba(255, 240, 220, 0.03);
      border: 1px solid rgba(251, 146, 60, 0.12);
      border-radius: 24px;
      padding: 56px 64px;
      max-width: 680px;
      width: 90%;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 0 1px rgba(251, 146, 60, 0.1),
        0 32px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 200, 150, 0.06);
    }

    /* カード上部のグロー */
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(251, 146, 60, 0.7), transparent);
    }

    .avatar-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }

    .avatar-frame {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 外側の回転リング */
    .avatar-frame::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #f97316 0%,
        #fbbf24 25%,
        transparent 40%,
        transparent 60%,
        #fb923c 75%,
        #f97316 100%
      );
      animation: spin 4s linear infinite;
    }

    /* 内側マスク（リング形状に見せる） */
    .avatar-frame::after {
      content: '';
      position: absolute;
      inset: 0px;
      border-radius: 50%;
      background: #12090a;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fbbf24, #f97316 55%, #c2410c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      box-shadow:
        0 0 0 2px rgba(251, 146, 60, 0.4),
        0 0 28px rgba(249, 115, 22, 0.5),
        inset 0 1px 0 rgba(255,255,255,0.2);
      letter-spacing: -0.02em;
    }

    /* 外側のアンビエントグロー */
    .avatar-glow {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.18) 0%, transparent 70%);
      animation: glow-pulse 3s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(251, 146, 60, 0.1);
      border: 1px solid rgba(251, 146, 60, 0.3);
      color: #fdba74;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #fb923c;
      border-radius: 50%;
      box-shadow: 0 0 6px #fb923c;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff7ed 0%, #fed7aa 60%, #fdba74 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .role {
      font-size: 1.05rem;
      color: #78716c;
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(251, 146, 60, 0.15), transparent);
      margin: 32px 0;
    }

    .bio {
      font-size: 0.975rem;
      line-height: 1.8;
      color: #a8a29e;
      margin-bottom: 36px;
    }

    .bio strong {
      color: #fed7aa;
      font-weight: 600;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 40px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(251, 146, 60, 0.15);
      color: #a8a29e;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tag:hover {
      background: rgba(251, 146, 60, 0.08);
      border-color: rgba(251, 146, 60, 0.35);
      color: #fdba74;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: #fff;
      box-shadow: 0 4px 24px rgba(234, 88, 12, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(234, 88, 12, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(251, 146, 60, 0.18);
      color: #a8a29e;
    }

    .btn-secondary:hover {
      background: rgba(251, 146, 60, 0.07);
      color: #fed7aa;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.75rem;
      color: #44403c;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-wrapper">
      <div class="avatar-frame">
        <div class="avatar-glow"></div>
        <div class="avatar">太</div>
      </div>
    </div>

    <div style="text-align: center;">
      <div class="badge">AI Engineer</div>
    </div>

    <div style="text-align: center;">
      <h1>テスト太郎</h1>
      <p class="role">AI エンジニア &nbsp;·&nbsp; 東京</p>
    </div>

    <div class="divider"></div>

    <p class="bio">
      機械学習と大規模言語モデルの研究開発に取り組むエンジニアです。<br>
      <strong>LLM ファインチューニング</strong>や<strong>RAG アーキテクチャ</strong>の設計を得意とし、
      プロダクトへの AI 組み込みから基盤モデルの評価まで幅広く対応しています。
    </p>

    <div class="tags">
      <span class="tag">Python</span>
      <span class="tag">PyTorch</span>
      <span class="tag">LLM</span>
      <span class="tag">RAG</span>
      <span class="tag">MLOps</span>
      <span class="tag">FastAPI</span>
      <span class="tag">Docker</span>
      <span class="tag">AWS</span>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="mailto:taro@example.com">お問い合わせ</a>
      <a class="btn btn-secondary" href="#">GitHub</a>
    </div>

    <p class="footer">© 2026 テスト太郎</p>
  </div>
</body>
</html>
