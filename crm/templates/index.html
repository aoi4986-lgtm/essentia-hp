<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客フォロー管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">顧客フォロー管理</h1>
      <div style="display:flex;gap:0.6rem;align-items:center">
        <button class="btn btn-primary" id="btnAdd">＋ 顧客を追加</button>
        <a href="/logout" class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,0.4)">ログアウト</a>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- サマリーバー -->
    <div class="summary" id="summary"></div>

    <!-- タブ切り替え -->
    <div class="view-tabs">
      <button class="view-tab active" id="tabList">一覧</button>
      <button class="view-tab" id="tabCalendar">カレンダー</button>
    </div>

    <!-- 顧客一覧 -->
    <div class="customer-grid" id="customerGrid">
      <div class="loading">読み込み中...</div>
    </div>

    <!-- カレンダービュー -->
    <div class="calendar-view" id="calendarView" style="display:none">
      <div class="calendar-nav">
        <button class="btn btn-ghost btn-sm" id="calPrev">◀</button>
        <span class="calendar-title" id="calTitle"></span>
        <button class="btn btn-ghost btn-sm" id="calNext">▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </main>

  <!-- 顧客登録・編集パネル -->
  <div class="overlay" id="overlay"></div>
  <aside class="side-panel" id="sidePanel">
    <div class="panel-header">
      <h2 id="panelTitle">顧客を追加</h2>
      <button class="btn-close" id="btnClose">×</button>
    </div>
    <form id="customerForm" class="form">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>顧客名 <span class="required">*</span></label>
        <input type="text" id="fName" placeholder="山田 太郎" required>
      </div>
      <div class="form-group">
        <label>会社名</label>
        <input type="text" id="fCompany" placeholder="株式会社〇〇">
      </div>
      <div class="form-group">
        <label>連絡先</label>
        <input type="text" id="fContact" placeholder="090-0000-0000 / email@example.com">
      </div>
      <div class="form-group">
        <label>担当者</label>
        <input type="text" id="fAssignee" placeholder="鈴木">
      </div>
      <div class="form-group">
        <label>ジャンル</label>
        <select id="fGenre">
          <option value="">未選択</option>
          <option value="入居付">入居付</option>
          <option value="OA関係">OA関係</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>次回フォロー日</label>
        <input type="date" id="fNextDate">
      </div>
      <div class="form-group">
        <label>メモ</label>
        <textarea id="fNotes" placeholder="商談内容・特記事項など" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
        <button type="button" class="btn btn-ghost" id="btnCancel">キャンセル</button>
      </div>
    </form>
  </aside>

  <!-- フォロー記録モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="followModal">
      <div class="modal-header">
        <h3 id="modalCustomerName"></h3>
        <button class="btn-close" id="btnModalClose">×</button>
      </div>
      <div class="modal-body">
        <section class="follow-form-section">
          <h4>フォローを記録する</h4>
          <input type="hidden" id="followCustomerId">
          <div class="form-group">
            <label>実施日</label>
            <input type="date" id="followDate">
          </div>
          <div class="form-group">
            <label>内容メモ</label>
            <textarea id="followMemo" placeholder="電話で確認済み、次回〇月に提案予定" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label>期待度</label>
            <div class="expect-btns">
              <button type="button" class="btn-expect high" data-days="3">🔥 高い（3日後）</button>
              <button type="button" class="btn-expect mid" data-days="14">😐 普通（14日後）</button>
              <button type="button" class="btn-expect low" data-days="30">🧊 低い（30日後）</button>
            </div>
          </div>
          <div class="form-group">
            <label>次回フォロー日</label>
            <input type="date" id="followNextDate">
          </div>
          <button class="btn btn-primary" id="btnFollowSave">記録する</button>
        </section>
        <section class="history-section">
          <h4>フォロー履歴</h4>
          <div id="historyList" class="history-list"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- AIチャットモーダル -->
  <div class="modal-backdrop" id="chatModalBackdrop">
    <div class="modal chat-modal" id="chatModal">
      <div class="modal-header">
        <h3 id="chatModalTitle">💬 AIと相談</h3>
        <button class="btn-close" id="btnChatModalClose">×</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="状況を教えてください..." rows="2"></textarea>
        <button class="btn btn-primary" id="btnChatSend">送信</button>
      </div>
    </div>
  </div>

  <!-- AI モーダル -->
  <div class="modal-backdrop" id="aiModalBackdrop">
    <div class="modal" id="aiModal">
      <div class="modal-header">
        <h3 id="aiModalTitle">AI提案</h3>
        <button class="btn-close" id="btnAiModalClose">×</button>
      </div>
      <div class="modal-body">
        <div id="aiResult" class="ai-result">生成中...</div>
        <button class="btn btn-ghost btn-sm" id="btnCopyAi" style="margin-top:0.8rem">コピー</button>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
