<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — 顧客フォロー管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #059669 0%, #0ea5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.16);
      padding: 2.6rem 2.2rem;
      width: 360px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    .logo { font-size: 1rem; font-weight: 800; color: #059669; text-align: center; letter-spacing: 0.04em; }
    h2 { font-size: 1.2rem; font-weight: 700; text-align: center; color: #1e293b; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.82rem; font-weight: 600; color: #475569; }
    input[type="email"], input[type="password"] {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: #1e293b;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5,150,105,0.12);
    }
    .form { display: flex; flex-direction: column; gap: 1rem; }
    .btn {
      background: linear-gradient(135deg, #059669, #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 0.4rem;
      box-shadow: 0 2px 10px rgba(5,150,105,0.3);
      transition: all 0.18s;
    }
    .btn:hover { box-shadow: 0 4px 16px rgba(5,150,105,0.4); transform: translateY(-1px); }
    .error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">顧客フォロー管理</div>
    <h2>ログイン</h2>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="form">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
      </div>
      <button type="submit" class="btn">ログイン</button>
    </form>
  </div>
</body>
</html>
