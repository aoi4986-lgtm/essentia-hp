<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — 顧客フォロー管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.4rem 2rem;
      width: 340px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    .logo { font-size: 1rem; font-weight: 700; color: #2d8653; text-align: center; }
    h2 { font-size: 1.2rem; font-weight: 700; text-align: center; color: #1f2937; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.82rem; font-weight: 500; color: #4b5563; }
    input[type="password"] {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { outline: none; border-color: #2d8653; }
    .btn {
      background: #2d8653;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.7rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .error {
      background: #fdecea;
      color: #c0392b;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">顧客フォロー管理</div>
    <h2>ログイン</h2>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" autofocus required>
      </div>
      <br>
      <button type="submit" class="btn">ログイン</button>
    </form>
  </div>
</body>
</html>
