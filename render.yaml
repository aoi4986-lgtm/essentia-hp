services:
  - type: web
    name: essentia-crm
    runtime: python
    rootDir: crm
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: essentia-crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false  # Renderダッシュボードで手動設定

databases:
  - name: essentia-crm-db
    plan: free
